baseURL = 'https://wunaiwuhuang.github.io/'
title = 'Guojia Wu'
theme = 'stack'

defaultContentLanguage = 'en'

[languages.en]
  languageName = 'English'
  languageCode = 'en'
  locale = 'en-US'
  weight = 1

[params]
  mainSections = ['posts', 'projects', 'publications']

[params.sidebar]
  subtitle = 'Undergraduate Researcher — Basic Medicine & Bioinformatics'
  avatar = '/images/avatar.jpg'

[params.article]
  [params.article.math]
    enable = true

[params.widgets]
  homepage = [
    { type = "search" },
    { type = "archives", params = { limit = 5 } },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } },
  ]
  page = [
    { type = "toc" },
  ]

[params.colorScheme]
  toggle = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 1
  [markup.goldmark.renderer]
    unsafe = true

